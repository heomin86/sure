<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1eb">
    <title>가계부</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233e6b57'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <h1>가계부</h1>
        <p class="lede">이 기기의 브라우저에만 저장됩니다.</p>
      </header>

      <section class="panel" aria-labelledby="month-label">
        <div class="month-bar">
          <button type="button" id="prev-month">이전 달</button>
          <h2 id="month-label">월</h2>
          <button type="button" id="next-month">다음 달</button>
        </div>
        <dl class="totals">
          <div>
            <dt>수입</dt>
            <dd id="total-income">0원</dd>
          </div>
          <div>
            <dt>지출</dt>
            <dd id="total-expense">0원</dd>
          </div>
          <div>
            <dt>잔액</dt>
            <dd id="total-balance">0원</dd>
          </div>
        </dl>
      </section>

      <form id="entry-form" class="panel" novalidate>
        <fieldset class="type-toggle">
          <legend>구분</legend>
          <label>
            <input type="radio" name="type" value="expense" checked>
            <span>지출</span>
          </label>
          <label>
            <input type="radio" name="type" value="income">
            <span>수입</span>
          </label>
        </fieldset>

        <label class="field">
          <span>날짜</span>
          <input type="date" name="date" id="entry-date" min="2000-01-01" max="2100-12-31">
        </label>

        <label class="field">
          <span>반복</span>
          <select name="cycle" id="entry-cycle">
            <option value="none">없음</option>
            <option value="daily">매일</option>
            <option value="weekly">매주</option>
            <option value="biweekly">2주마다</option>
            <option value="monthly">매월</option>
            <option value="yearly">매년</option>
          </select>
        </label>
        <p class="field-note">없음은 그 날짜만입니다. 매주는 같은 요일, 2주마다는 14일마다, 매월은 같은 날, 매년은 같은 달의 같은 날이며, 고른 날짜부터 적용됩니다.</p>

        <label class="field">
          <span>금액</span>
          <input type="text" name="amount" id="entry-amount" inputmode="numeric" autocomplete="off" placeholder="예: 12000" maxlength="20">
        </label>

        <label class="field">
          <span>통화</span>
          <select name="currency" id="entry-currency">
            <option value="KRW">원</option>
            <option value="AUD">A$</option>
          </select>
        </label>

        <label class="field">
          <span>분류</span>
          <select name="category" id="entry-category">
            <option value="식비">식비</option>
            <option value="교통">교통</option>
            <option value="주거">주거</option>
            <option value="급여">급여</option>
            <option value="기타">기타</option>
          </select>
        </label>

        <label class="field">
          <span>직접 입력</span>
          <input type="text" name="customCategory" id="custom-category" maxlength="20" placeholder="다른 분류가 있으면 여기에 적습니다" autocomplete="off">
        </label>

        <label class="field">
          <span>메모</span>
          <input type="text" name="memo" id="entry-memo" maxlength="80" placeholder="짧게 적어도 됩니다" autocomplete="off">
        </label>

        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="submit">기록하기</button>
      </form>

      <section class="panel" aria-labelledby="list-heading">
        <div class="list-head">
          <h2 id="list-heading">이 달의 기록</h2>
          <p id="entry-count">0건</p>
        </div>
        <p id="empty" class="empty">이 달에는 기록이 없습니다.</p>
        <ul id="entry-list"></ul>
      </section>
    </main>
    <noscript>
      <p class="noscript">이 가계부는 자바스크립트가 있어야 동작합니다.</p>
    </noscript>
    <script src="app.js"></script>
  </body>
</html>
